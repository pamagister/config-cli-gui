name: Release

# Triggered by a tag push, normally created by `make release`.
#
# Linux-only release (default):
#   make release
#
# Release with optional Windows/macOS builds:
#   make release ALL=1
#   This appends `--all` to the subject of the tagged HISTORY.md commit.
#   The `flags` job reads that subject, so the tag itself must point at the
#   commit carrying the marker.
#
# Re-run the pipeline for an existing tag (for example to add the optional
# Windows/macOS artifacts without creating a new release):
#   gh workflow run release.yml --ref <tag> -f all=true
#
# A tag push always runs the quality gate, creates the GitHub release and
# publishes to PyPI. Windows/macOS builds are opt-in.

permissions:
  contents: write

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      all:
        description: 'Also build Windows and macOS'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detects `--all` in the tagged commit subject (or the manual `all` input)
  # and exposes it as a job output. Environment variables from $GITHUB_ENV do
  # not cross job boundaries, so a proper output is required here.
  flags:
    runs-on: ubuntu-latest
    outputs:
      build_all: ${{ steps.detect.outputs.build_all }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        env:
          INPUT_ALL: ${{ github.event.inputs.all }}
        run: |
          COMMIT_SUBJECT="$(git log -1 --format=%s)"
          if [[ "$COMMIT_SUBJECT" == *"--all"* || "$INPUT_ALL" == "true" ]]; then
            echo "build_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_all=false" >> "$GITHUB_OUTPUT"
          fi

  # Quality gate: lint + unit tests before any release artifact is created.
  quality:
    needs: flags
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Setup Environment # Composite Action
        uses: ./.github/actions/setup-environment
        with:
          python-version: '3.11'
      - name: Run quality gate (lint + tests)
        run: make test

  release:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate Changelog
        run: .github/release_message.sh > release_message.md
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_message.md

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build and publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m build
          twine upload dist/*
